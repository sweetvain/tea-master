<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un Module // TeaMasters</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style-collec.css') }}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght=700;900&family=Share+Tech+Mono&display=swap');

:root {
    --neon-purple: #b06bff;
    --neon-blue: #00f0ff;
    --neon-green: #39ff6a;
    --neon-red: #ff2d55;
    --cyber-bg-dark: #080810;
    --surface-cyber: #0c0b14;
    --border-cyber: rgba(0, 240, 255, 0.15);
}

body {
    background-color: var(--cyber-bg-dark);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    margin: 0;
    padding: 0;
}

/* --- CENTRAGE PARFAIT DU BLOC --- */
.create-container {
    width: 100%;
    max-width: 900px;
    margin: auto !important; /* Force le centrage vertical et horizontal restant */
    padding: 40px 20px;
    box-sizing: border-box;
    display: flex;
    margin-top: 110px !important;
    flex-direction: column;
    justify-content: center;
}

.page-cyber-title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 1.8rem;
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-transform: uppercase;
    text-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
}

.page-cyber-subtitle {
    font-family: 'Share Tech Mono', monospace;
    color: #64647a;
    font-size: 14px;
    margin-bottom: 30px;
    text-transform: uppercase;
}

/* --- LAYOUT DU FORMULAIRE --- */
.cyber-form-grid {
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    gap: 30px;
    background: var(--surface-cyber);
    border: 1px solid var(--border-cyber);
    padding: 30px;
    border-radius: 4px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 0 15px rgba(0, 240, 255, 0.02);
    position: relative;
}

@media (max-width: 768px) {
    .cyber-form-grid { grid-template-columns: 1fr; }
}

/* --- ZONE DRAG & DROP (GLISSADE) --- */
.cyber-dropzone {
    border: 2px dashed rgba(176, 107, 255, 0.3);
    background: #11101a;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    position: relative;
    min-height: 300px;
    overflow: hidden;
    transition: border-color 0.3s, background-color 0.3s;
}
.cyber-dropzone.dragover {
    border-color: var(--neon-blue);
    background: rgba(0, 240, 255, 0.05);
}

.dropzone-input { display: none; }

.dropzone-infotext {
    font-family: 'Share Tech Mono', monospace;
    color: #7a7a90;
    pointer-events: none;
}
.dropzone-icon {
    font-size: 2.5rem;
    color: var(--neon-purple);
    margin-bottom: 15px;
    text-shadow: 0 0 10px rgba(176, 107, 255, 0.4);
    pointer-events: none;
}

/* PREVIEW IMAGE IMAGE GLISSÉE */
.cyber-preview-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #11101a;
    display: none;
    align-items: center;
    justify-content: center;
}
.cyber-preview-img {
    width: 100%; height: 100%;
    object-fit: cover;
}
.cyber-preview-overlay {
    position: absolute;
    bottom: 0; left: 0; width: 100%;
    background: rgba(12, 11, 20, 0.85);
    padding: 10px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px; color: var(--neon-blue);
    text-align: center;
    border-top: 1px solid rgba(0, 240, 255, 0.2);
}

/* --- INPUTS & CHAMPS CONTROLS --- */
.cyber-form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 18px;
}
.cyber-form-group label {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
    color: #a4a4ba;
    text-transform: uppercase;
}
.cyber-input, .cyber-textarea, .cyber-select {
    background: #141320;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 4px;
    padding: 12px;
    color: #fff;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
}
.cyber-input:focus, .cyber-textarea:focus, .cyber-select:focus {
    border-color: var(--neon-purple);
    box-shadow: 0 0 10px rgba(176, 107, 255, 0.2);
}
.cyber-textarea { resize: vertical; min-height: 80px; }

.cyber-select option {
    background: #0c0b14;
    color: #fff;
}

.form-row-twin {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

/* BOUTON SOUMISSION CYBER */
.cyber-submit-wrapper {
    grid-column: 1 / -1;
    margin-top: 10px;
}
.btn-cyber-generate {
    width: 100%;
    background: transparent;
    border: 1px solid var(--neon-green);
    color: var(--neon-green);
    padding: 16px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 1rem;
    letter-spacing: 2px;
    cursor: pointer;
    position: relative;
    box-shadow: 0 0 10px rgba(57, 255, 106, 0.1);
    transition: all 0.3s ease;
}
.btn-cyber-generate:hover {
    background: var(--neon-green);
    color: #080810;
    box-shadow: 0 0 30px rgba(57, 255, 106, 0.5);
}
    </style>
</head>
<body>

    {% with active_page='create' %}
        {% include 'header.html' %}
    {% endwith %}

    <main class="create-container">
        <h1 class="page-cyber-title">DATA // COMPILER_UNIT</h1>
        <p class="page-cyber-subtitle">Générer et injecter un nouveau module de carte dans le système central</p>

        <form id="cyber-create-form" enctype="multipart/form-data">
            <div class="cyber-form-grid">
                
                <!-- ZONE GLISSADE IMAGE (DRAG & DROP) -->
                <div class="cyber-dropzone" id="dropzone" onclick="document.getElementById('photo-input').click()">
                    <div class="dropzone-icon" id="dz-icon">⎋</div>
                    <p class="dropzone-infotext" id="dz-text">GLISSER & DÉPOSER UNE MATRIX_IMAGE<br><span style="font-size:11px; opacity:0.5;">OU CLIQUER ICI</span></p>
                    <input type="file" name="photo" id="photo-input" class="dropzone-input" accept="image/*">
                    
                    <!-- Conteneur de prévisualisation -->
                    <div class="cyber-preview-container" id="preview-container">
                        <img src="" alt="Aperçu" class="cyber-preview-img" id="preview-img">
                        <div class="cyber-preview-overlay">FICHIER CHARGÉ AVEC SUCCÈS // APPUYER POUR CHANGER</div>
                    </div>
                </div>

                <!-- FORMULAIRE DE DONNÉES -->
                <div>
                    <div class="cyber-form-group">
                        <label for="name">Nom du module</label>
                        <input type="text" id="name" name="name" class="cyber-input" placeholder="Ex: Cyber Dragon V2..." required autocomplete="off">
                    </div>

                    <div class="form-row-twin">
                        <div class="cyber-form-group">
                            <label for="initials">Initiales (Tag)</label>
                            <input type="text" id="initials" name="initials" class="cyber-input" placeholder="Ex: CD2" maxlength="5" required autocomplete="off">
                        </div>
                        <div class="cyber-form-group">
                            <label for="power">Puissance énergétique</label>
                            <input type="number" id="power" name="power" class="cyber-input" placeholder="Ex: 95" required autocomplete="off">
                        </div>
                    </div>

                    <div class="form-row-twin">
                        <div class="cyber-form-group">
                            <label for="role">Spécialisation (Rôle)</label>
                            <input type="text" id="role" name="role" class="cyber-input" placeholder="Ex: Netrunner" required autocomplete="off">
                        </div>
                        <div class="cyber-form-group">
                            <label for="rarity">Indice de rareté</label>
                            <select id="rarity" name="rarity" class="cyber-select" required>
                                <option value="Hess">Hess</option>
                                <option value="Rare">Rare</option>
                                <option value="Epique">Épique</option>
                                <option value="Legendaire">Légendaire</option>
                                <option value="Mythique">Mythique</option>
                                <option value="GOAT">GOAT</option>
                            </select>
                        </div>
                    </div>

                    <div class="cyber-form-group">
                        <label for="description">Spécifications techniques (Description)</label>
                        <textarea id="description" name="description" class="cyber-textarea" placeholder="Entrer les détails du noyau algorithmique..." required></textarea>
                    </div>
                </div>

                <!-- BOUTON ENVOI -->
                <div class="cyber-submit-wrapper">
                    <button type="submit" class="btn-cyber-generate" id="btn-submit">
                        INJECTER LA CARTE DANS LE SYSTEME
                    </button>
                </div>

            </div>
        </form>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Animation GSAP d'entrée séquentielle
            gsap.from(".cyber-form-grid", { opacity: 0, y: 30, duration: 0.6, ease: "power3.out" });
            gsap.from(".cyber-dropzone", { opacity: 0, scale: 0.95, duration: 0.5, delay: 0.2, ease: "back.out(1.2)" });
            gsap.from(".cyber-form-group", { opacity: 0, x: 20, duration: 0.4, delay: 0.3, stagger: 0.08, ease: "power2.out" });

            // Éléments DOM Dropzone
            const dropzone = document.getElementById("dropzone");
            const fileInput = document.getElementById("photo-input");
            const previewContainer = document.getElementById("preview-container");
            const previewImg = document.getElementById("preview-img");

            // Gestion du Drag & Drop (Glissade)
            ['dragenter', 'dragover'].forEach(eventName => {
                dropzone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    dropzone.classList.add('dragover');
                    gsap.to(dropzone, { scale: 1.02, duration: 0.2 });
                }, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropzone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    dropzone.classList.remove('dragover');
                    gsap.to(dropzone, { scale: 1, duration: 0.2 });
                }, false);
            });

            dropzone.addEventListener('drop', (e) => {
                const dt = e.dataTransfer;
                const files = dt.files;
                if (files.length) {
                    fileInput.files = files;
                    handlePreview(files[0]);
                }
            });

            // Changement via clic classique
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length) {
                    handlePreview(e.target.files[0]);
                }
            });

            // Fonction d'affichage de la prévisualisation avec animation GSAP
            function handlePreview(file) {
                if (!file.type.startsWith('image/')) {
                    showNotification("FORMAT DE FICHIER INVALIDE", "error");
                    return;
                }
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onloadend = () => {
                    previewImg.src = reader.result;
                    previewContainer.style.display = 'flex';
                    gsap.fromTo(previewContainer, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" });
                    showNotification("FICHIER IMPORTÉ DANS LE BUFFER", "info");
                }
            }

            // SOUMISSION EN FETCH (Mise à jour en DB sans rechargement lourd)
            const form = document.getElementById("cyber-create-form");
            form.addEventListener("submit", (e) => {
                e.preventDefault();

                const formData = new FormData(form);

                // Petite animation visuelle sur le bouton au clic
                gsap.to("#btn-submit", { scale: 0.98, yoyo: true, repeat: 1, duration: 0.1 });

                fetch("/create", {
                    method: "POST",
                    body: formData
                })
                .then(res => {
                    if (res.redirected || res.ok) {
                        showNotification("CARTE ENREGISTRÉE AVEC SUCCÈS IN DB", "success");
                        
                        // Reset du formulaire complet
                        form.reset();
                        previewContainer.style.display = 'none';
                        previewImg.src = '';
                        
                        // Légère animation de félicitations sur la grille
                        gsap.fromTo(".cyber-form-grid", { boxShadow: "0 0 30px rgba(57, 255, 106, 0.4)" }, { boxShadow: "0 20px 40px rgba(0,0,0,0.6)", duration: 1 });
                    } else {
                        showNotification("ERREUR LORS DE L'INJECTION DES DONNÉES", "error");
                    }
                })
                .catch(() => {
                    showNotification("PANNE RÉSEAU : SERVEUR INDISPONIBLE", "error");
                });
            });
        });
    </script>
</body>
</html>
