<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un Module // TeaMasters</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style-collec.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/create.css') }}">
</head>
<body>

    {% with active_page='create' %}
        {% include 'header.html' %}
    {% endwith %}

    <main class="create-container">
        <h1 class="page-cyber-title">DATA // COMPILER_UNIT</h1>
        <p class="page-cyber-subtitle">Générer et injecter un nouveau module de carte dans le système central</p>

        <form id="cyber-create-form" enctype="multipart/form-data">
            <div class="cyber-form-grid">
                
                <!-- ZONE GLISSADE IMAGE (DRAG & DROP) -->
                <div class="cyber-dropzone" id="dropzone" onclick="document.getElementById('photo-input').click()">
                    <div class="dropzone-icon" id="dz-icon">⎋</div>
                    <p class="dropzone-infotext" id="dz-text">GLISSER & DÉPOSER UNE MATRIX_IMAGE<br><span style="font-size:11px; opacity:0.5;">OU CLIQUER ICI</span></p>
                    <input type="file" name="photo" id="photo-input" class="dropzone-input" accept="image/*">
                    
                    <!-- Conteneur de prévisualisation -->
                    <div class="cyber-preview-container" id="preview-container">
                        <img src="" alt="Aperçu" class="cyber-preview-img" id="preview-img">
                        <div class="cyber-preview-overlay">FICHIER CHARGÉ AVEC SUCCÈS // APPUYER POUR CHANGER</div>
                    </div>
                </div>

                <!-- FORMULAIRE DE DONNÉES -->
                <div>
                    <div class="cyber-form-group">
                        <label for="name">Nom du module</label>
                        <input type="text" id="name" name="name" class="cyber-input" placeholder="Ex: Cyber Dragon V2..." required autocomplete="off">
                    </div>

                    <div class="form-row-twin">
                        <div class="cyber-form-group">
                            <label for="initials">Initiales (Tag)</label>
                            <input type="text" id="initials" name="initials" class="cyber-input" placeholder="Ex: CD2" maxlength="5" required autocomplete="off">
                        </div>
                        <div class="cyber-form-group">
                            <label for="power">Puissance énergétique</label>
                            <input type="number" id="power" name="power" class="cyber-input" placeholder="Ex: 95" required autocomplete="off">
                        </div>
                    </div>

                    <div class="form-row-twin">
                        <div class="cyber-form-group">
                            <label for="role">Spécialisation (Rôle)</label>
                            <input type="text" id="role" name="role" class="cyber-input" placeholder="Ex: Netrunner" required autocomplete="off">
                        </div>
                        <div class="cyber-form-group">
                            <label for="rarity">Indice de rareté</label>
                            <select id="rarity" name="rarity" class="cyber-select" required>
                                <option value="Hess">Hess</option>
                                <option value="Rare">Rare</option>
                                <option value="Epique">Épique</option>
                                <option value="Legendaire">Légendaire</option>
                                <option value="Mythique">Mythique</option>
                                <option value="GOAT">GOAT</option>
                            </select>
                        </div>
                    </div>

                    <div class="cyber-form-group">
                        <label for="description">Spécifications techniques (Description)</label>
                        <textarea id="description" name="description" class="cyber-textarea" placeholder="Entrer les détails du noyau algorithmique..." required></textarea>
                    </div>
                </div>

                <!-- BOUTON ENVOI -->
                <div class="cyber-submit-wrapper">
                    <button type="submit" class="btn-cyber-generate" id="btn-submit">
                        INJECTER LA CARTE DANS LE SYSTEME
                    </button>
                </div>

            </div>
        </form>
    </main>

    <script src="{{ url_for('static', filename='js/create-card.js') }}"></script>
</body>
</html>
