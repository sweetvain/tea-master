<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ouverture de Pack - TeaMasters</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style-collec.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style-pull.css') }}">
</head>
<body>

    {% include 'header.html' %}

    <main class="main-content pull-container">
        <h1 class="pull-title">Ouverture du Pack</h1>
        
        <!-- Scène 3D -->
        <div class="card-scene">
            <div id="flip-container" class="card-wrapper">
                <!-- Verso -->
                <div class="card-face card-back">
                    <div class="card-back-content">TeaMasters</div>
                </div>
                <!-- Recto (Injecté par makeModalCardEl) -->
                <div class="card-face card-front" id="modal-card-el-pull"></div>
            </div>
            
            <!-- Bouton brillant bas-droite -->
            <button id="action-btn" class="glowing-btn" onclick="handleAction()">Continuer</button>
        </div>
    </main>

    {% include 'card_modal.html' %}

    <script id="pull-data" type="application/json">{{ drawn_cards | tojson }}</script>
    <script src="{{ url_for('static', filename='js/pull-reveal.js') }}"></script>
</body>
</html>
