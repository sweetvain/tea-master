<link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
<script src="{{ url_for('static', filename='js/header.js') }}" defer></script>

{% include '_background.html' %}

<nav class="cyber-header">
    <div class="header-left">
        <a href="{{ url_for('main.index') }}" class="cyber-logo">TeaMasters<span class="neon-dot">.</span></a>
    </div>

    <div class="cyber-nav-links">
        <a href="{{ url_for('main.index') }}" class="cyber-nav-link {% if active_page == 'packs' %}active{% endif %}" data-text="Packs">Packs</a>
        <a href="{{ url_for('main.collection') }}" class="cyber-nav-link {% if active_page == 'collection' %}active{% endif %}" data-text="Collection">Collection</a>
        <a href="{{ url_for('main.create') }}" class="cyber-nav-link {% if active_page == 'create' %}active{% endif %}" data-text="Créer">Créer</a>
        <a href="{{ url_for('profile.profile') }}" class="cyber-nav-link {% if active_page == 'profile' %}active{% endif %}" data-text="Profil">Profil</a>
    </div>

    <div class="header-right">
        <button class="cyber-btn-invite" onclick="openInviteModal(event)">
            <span class="btn-glitch-text">INVITER DES AMIS</span>
            <span class="btn-icon">✦</span>
        </button>
        <div class="cyber-user-profile">
            <div class="cyber-avatar">{{ current_user.username[:2]|upper }}</div>
            <div class="cyber-user-info">
                <span class="cyber-username">{{ current_user.username }}</span>
                <a href="{{ url_for('auth.logout') }}" class="cyber-logout-btn">DISCONNECT</a>
            </div>
        </div>
    </div>
</nav>

{% if is_admin %}
<a href="{{ url_for('admin.panel') }}" class="admin-float-btn" data-text="Admin">
    <span class="admin-icon">★</span> Admin
</a>
{% endif %}

<div id="toast-container"></div>

<div id="invite-modal" class="cyber-modal-overlay" onclick="closeInviteModal(event)">
    <div class="cyber-modal-card" onclick="event.stopPropagation()">
        <div class="modal-corner top-left"></div>
        <div class="modal-corner bottom-right"></div>
        <button class="cyber-modal-close" onclick="closeInviteModal(null)">✕</button>

        <h2 class="cyber-modal-title">HACK // TRANSMIT_INVITE</h2>
        <p class="cyber-modal-subtitle">Entre le canal utilisateur exact pour synchroniser vos bases de données.</p>

        <div class="cyber-modal-form">
            <input type="text" id="modal-friend-username" placeholder="USER_TAG_ID..." autocomplete="off">
            <button type="button" class="cyber-btn-submit" onclick="submitInviteFromModal()">INITIALISER LA REQUÊTE</button>
        </div>
    </div>
</div>
