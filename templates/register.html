<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - TeaMasters</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style-auth.css') }}">
</head>
<body>
    <div class="auth-screen">
        <div>
            <div class="auth-logo">TeaMasters</div>
            <div class="auth-tagline">Le jeu de cartes entre potes ✦</div>
        </div>
        <div class="auth-box">
            <form method="POST">
                <div class="form-group">
                    <label for="username" class="form-label">Pseudo</label>
                    <input type="text" id="username" name="username" placeholder="Choisis un pseudo unique" required>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Code Secret</label>
                    <input type="password" id="password" name="password" placeholder="Choisis un code secret" required>
                </div>
                
                {% if error %}
                    <div class="error-msg">{{ error }}</div>
                {% endif %}

                <button type="submit" class="btn-primary">Créer mon compte</button>
            </form>
            <div class="switch-form-link">
                Déjà un compte ? <a href="{{ url_for('login') }}">Connecte-toi</a>
            </div>
        </div>
    </div>
</body>
</html>
