<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    {% include '_head.html' %}
    <title>Modifier une carte ? TeaMasters</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/edit-card.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/glass.css') }}">
</head>
<body>

    {% include 'header.html' %}

    <div class="admin-container">
        <h1>Modifier : {{ card.name }}</h1>
        
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label>Nom de la carte</label>
                <input type="text" name="name" value="{{ card.name }}" required>
            </div>

            <div class="form-group">
                <label>Rareté</label>
                <select name="rarity">
                    <option value="Hess" {% if card.rarity == 'Hess' %}selected{% endif %}>Hess</option>
                    <option value="Rare" {% if card.rarity == 'Rare' %}selected{% endif %}>Rare</option>
                    <option value="Epique" {% if card.rarity == 'Epique' %}selected{% endif %}>Épique</option>
                    <option value="Legendaire" {% if card.rarity == 'Legendaire' %}selected{% endif %}>Légendaire</option>
                    <option value="Mythique" {% if card.rarity == 'Mythique' %}selected{% endif %}>Mythique</option>
                    <option value="GOAT" {% if card.rarity == 'GOAT' %}selected{% endif %}>GOAT</option>
                </select>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="3">{{ card.description }}</textarea>
            </div>

            <div class="form-group">
                <label>Image actuelle</label>
                {% if card.photo %}
                    <img src="{{ url_for('static', filename='uploads/' + card.photo) }}" class="current-img">
                {% else %}
                    <p style="font-size: 0.8rem; color: #555;">Aucune image</p>
                {% endif %}
                <input type="file" name="photo">
            </div>

            <button type="submit" class="btn-submit">Enregistrer les modifications</button>
        </form>
    </div>

</body>
</html>
