<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeaMasters - Packs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style-pack.css') }}">
</head>
<body>

    {% with active_page='packs' %}
        {% include 'header.html' %}
    {% endwith %}

    <main class="main-content">
        <header>
            <h1 class="page-title">Ouvrir un paquet</h1>
        </header>

        {% if message %}
            <div class="alert-box">
                <p class="error-message">{{ message }}</p>
            </div>
        {% endif %}
        
        <section class="booster-section">
            <div class="booster-container">
                <img src="{{ url_for('static', filename='img/test.png') }}" alt="Paquet de cartes" class="booster-pack-style">
            </div>
            
            <form action="{{ url_for('main.pull') }}" method="POST">
                <button type="submit" class="btn-primary btn-open" {% if packs == 0 %}disabled{% endif %}>
                    {{ "Ouvrir le paquet" if packs > 0 else "Packs épuisés" }}
                </button>
            </form>
        </section>
        
        <footer class="pack-counter">
            <p>Packs disponibles : <span id="packs-count">{{ packs }}</span> / {{ packs_max }}</p>
            <div id="timer" class="timer-text" {% if refresh_in is not none %}data-remaining="{{ refresh_in }}"{% endif %}>Chargement du temps...</div>
        </footer>
    </main>

    <script src="{{ url_for('static', filename='js/pack-timer.js') }}"></script>
</body>
</html>
