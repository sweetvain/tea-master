<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    {% include '_head.html' %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - TeaMasters</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style-auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/glass.css') }}">
</head>
<body>
    {% include '_background.html' %}
    <div class="auth-screen">
        <div>
            <div class="auth-logo">TeaMasters</div>
            <div class="auth-tagline">Le jeu de cartes entre potes ✦</div>
        </div>
        <div class="auth-box">
            <form method="POST">
                <div class="form-group">
                    <label for="username" class="form-label">Pseudo</label>
                    <input type="text" id="username" name="username" placeholder="Ex : Kévin, Sarah..." required>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Code Secret</label>
                    <input type="password" id="password" name="password" placeholder="•••••••" required>
                </div>
                
                {% if error %}
                    <div class="error-msg">{{ error }}</div>
                {% endif %}

                <button type="submit" class="btn-primary">Entrer dans le jeu</button>
            </form>
            <div class="switch-form-link">
                Pas encore de compte ? <a href="{{ url_for('auth.register') }}">Inscris-toi</a>
            </div>
        </div>
    </div>
</body>
</html>
